[project]
name = "ksa-ev-tender-monitor"
version = "1.0.0"
requires-python = ">=3.13"
description = "Daily monitoring of KSA EV-related tenders across multiple sources"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# The classic default set, so a newer ruff release does not turn CI red on its own.
select = ["E4", "E7", "E9", "F"]
