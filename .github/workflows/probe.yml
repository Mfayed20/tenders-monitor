name: Probe sources
on:
  push:
    branches: ["claude/probe"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python probe/probe.py
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name probe-bot
          git config user.email probe@users.noreply.github.com
          git add -f probe/out
          git commit -m "probe results [skip ci]" || true
          git push
