name: Daily Tender Monitor

on:
  schedule:
    # 07:00, 12:00, and 17:00 Asia/Riyadh (UTC+3).
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send a Telegram smoke-test message instead of scraping"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # publishes feed/tenders.json on the tender-feed branch for the CRM
  actions: write # keeps this schedule switched on (see the last step)

concurrency:
  group: daily-tender-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TENDER_OUTPUT_DIR: output
      TENDER_SEEN_DB_PATH: output/seen_tenders.db
      TENDER_LOG_LEVEL: INFO
      TENDER_FEED_PATH: feed/tenders.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore dedup database
        uses: actions/cache/restore@v4
        with:
          path: output/seen_tenders.db
          key: seen-tenders-${{ github.run_id }}
          restore-keys: |
            seen-tenders-

      - name: Restore the CRM feed
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.telegram_test }}
        run: |
          mkdir -p feed
          if git fetch --depth=1 origin tender-feed; then
            git show FETCH_HEAD:tenders.json > feed/tenders.json || rm -f feed/tenders.json
          fi

      - name: Run monitor
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.telegram_test }}
        run: python main.py

      - name: Publish the CRM feed
        # the CRM (crm.climch.com) reads tenders.json from the tender-feed branch
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || !inputs.telegram_test) && hashFiles('feed/tenders.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/tender-feed"
          rm -rf "$dir" && mkdir -p "$dir" && cp feed/tenders.json "$dir/"
          cd "$dir"
          git init -q -b tender-feed
          git add tenders.json
          git -c user.name="tender-monitor" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Tender feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:tender-feed

      - name: Send Telegram smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test }}
        run: python main.py --telegram-test

      - name: Ensure dedup database exists
        if: always()
        run: |
          mkdir -p output
          python - <<'PY'
          from utils.dedup import is_seen, set_db_path

          set_db_path("output/seen_tenders.db")
          is_seen("__healthcheck__", "", "")
          PY

      - name: Save dedup database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/seen_tenders.db
          key: seen-tenders-${{ github.run_id }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tender-monitor-output
          path: |
            output/tenders_*.csv
            output/all_tenders.csv
            output/seen_tenders.db
            output/run_summary.json
            feed/tenders.json
          if-no-files-found: warn
          retention-days: 30

      - name: Keep the schedule switched on
        # GitHub switches off scheduled workflows after 60 days without activity in the repository
        # (that is what stopped this monitor on 2026-09-05); re-enabling it every run resets that.
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-monitor.yml/enable"
